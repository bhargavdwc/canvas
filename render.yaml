services:
  - type: web
    name: spatial-canvas-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install --frozen-lockfile=false && pnpm --filter @canvas/shared-types build && pnpm --filter @canvas/validation build && pnpm --filter @canvas/api build
    startCommand: pnpm --filter @canvas/api start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "https://*.vercel.app,http://localhost:5173"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
